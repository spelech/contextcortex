[pytest]
pythonpath = .
filterwarnings =
    error
    ignore:.*Field 'lifespan' has an incomplete definition.*:UserWarning
    ignore:.*Field 'lifespan' has an incomplete definition.*:Warning
    ignore:.*unauthenticated requests to the HF Hub.*:UserWarning
    ignore:.*unclosed.*:ResourceWarning
    ignore:.*Unclosed.*:ResourceWarning
    ignore:.*MemoryObjectReceiveStream.*:pytest.PytestUnraisableExceptionWarning
