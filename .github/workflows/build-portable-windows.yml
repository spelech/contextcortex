name: Build Portable Windows x64 Bundle

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.22.0) to attach to if running manually'
        required: false
        default: ''
      postgres_version:
        description: 'PostgreSQL Windows x64 Binary Version'
        required: false
        default: '16.6-1'
      pgvector_version:
        description: 'pgvector Extension Version'
        required: false
        default: '0.8.0'
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - 'contextcortex.spec'
      - 'scripts/build_portable_windows.ps1'
      - 'scripts/portable/**'
      - 'main.py'
      - 'app/services/database/portable_postgres.py'
      - '.github/workflows/build-portable-windows.yml'

jobs:
  build-windows-portable:
    name: Build Portable Windows x64 (PostgreSQL + pgvector + Tree-sitter)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python Runtime & Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Assemble Portable Windows x64 Bundle (PyInstaller + PostgreSQL + pgvector)
        shell: pwsh
        run: |
          ./scripts/build_portable_windows.ps1 `
            -PostgresVersion "${{ github.event.inputs.postgres_version || '16.6-1' }}" `
            -PgVectorVersion "${{ github.event.inputs.pgvector_version || '0.8.0' }}" `
            -OutputDir "dist/contextcortex-windows-x64"

      - name: Smoke Test Portable Bundle Structure
        shell: pwsh
        run: |
          $bundle = "dist/contextcortex-windows-x64"
          if (-not (Test-Path "$bundle/contextcortex.exe")) { throw "Missing contextcortex.exe" }
          if (-not (Test-Path "$bundle/pgsql/bin/postgres.exe")) { throw "Missing portable postgres.exe" }
          if (-not (Test-Path "$bundle/pgsql/bin/initdb.exe")) { throw "Missing portable initdb.exe" }
          if (-not (Test-Path "$bundle/pgsql/bin/pg_ctl.exe")) { throw "Missing portable pg_ctl.exe" }
          if (-not (Test-Path "$bundle/pgsql/lib/vector.dll")) { throw "Missing compiled pgvector vector.dll" }
          if (-not (Test-Path "$bundle/pgsql/share/extension/vector.control")) { throw "Missing pgvector extension control file" }
          if (-not (Get-ChildItem "$bundle/grammars" -Recurse -Filter "tree_sitter_python.dll" -ErrorAction SilentlyContinue)) { throw "Missing pre-fetched tree-sitter grammars" }
          if (-not (Test-Path "$bundle/start-contextcortex.bat")) { throw "Missing start-contextcortex.bat" }
          Write-Host "All portable bundle artifacts verified!" -ForegroundColor Green

      - name: Runtime Smoke Test (start exe, bootstrap portable PostgreSQL, check /ready)
        shell: pwsh
        run: |
          $bundle = Resolve-Path "dist/contextcortex-windows-x64"
          # Keep test data out of the bundle so it is not zipped
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP "cc-smoke-data"
          $env:HOST = "127.0.0.1"
          $env:PORT = "3999"
          $env:PORTABLE_POSTGRES_ENABLED = "true"
          $env:PORTABLE_PG_PORT = "54399"
          $env:VECTOR_STORE_PROVIDER = "pgvector"
          $env:EMBEDDING_PROVIDER = "api"
          $env:EMBEDDING_MODEL = "text-embedding-3-small"
          $log = Join-Path $env:RUNNER_TEMP "cc-smoke.log"
          $proc = Start-Process -FilePath "$bundle/contextcortex.exe" -WorkingDirectory $bundle -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) { break }
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:3999/ready" -TimeoutSec 3
              if ($r.status -eq "ready" -and $r.database.type -eq "postgresql") { $ready = $true; break }
            } catch { }
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          Get-Process postgres -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue | Select-Object -Last 60
          if (-not $ready) { throw "Portable bundle did not become ready with portable PostgreSQL" }
          Write-Host "Portable bundle started and reported ready on PostgreSQL + pgvector." -ForegroundColor Green

      - name: Create Portable Zip Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/contextcortex-windows-x64/*" -DestinationPath "dist/contextcortex-windows-x64-portable.zip" -Force

      - name: Upload Portable Windows x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: contextcortex-windows-x64-portable
          path: dist/contextcortex-windows-x64-portable.zip
          retention-days: 30

      - name: Attach Portable Bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event.inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name || '' }}
          files: dist/contextcortex-windows-x64-portable.zip
