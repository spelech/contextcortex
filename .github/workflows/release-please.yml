name: Release Please

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Releases and tags created with GITHUB_TOKEN do not trigger other workflows
  # (release: published / push: tags), so the Windows bundle is built and
  # attached here, as a reusable workflow in the same run.
  windows-portable-bundle:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-portable-windows.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
